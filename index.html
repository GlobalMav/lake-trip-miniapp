<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f4f6" />
  <title>Закупки на озеро</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f6;
      --card: #ffffff;
      --card-2: #f9fafb;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --line-2: #d1d5db;
      --accent: #111827;
      --accent-soft: #eef2ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --ok: #059669;
      --warn: #d97706;
      --radius: 18px;
      --shadow: 0 8px 22px rgba(17, 24, 39, .07);
      --safe-top: max(10px, env(safe-area-inset-top));
      --safe-bottom: max(10px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    input {
      min-width: 0;
      border: 1px solid var(--line);
      outline: 0;
      background: #fff;
      color: var(--text);
      transition: border-color .12s ease, box-shadow .12s ease, background .12s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 4px rgba(17, 24, 39, .08);
    }

    input::placeholder {
      color: #9ca3af;
    }

    .app {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: var(--safe-top) 12px calc(88px + var(--safe-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -12px 10px;
      padding: var(--safe-top) 12px 10px;
      background: linear-gradient(180deg, rgba(243, 244, 246, .98) 0%, rgba(243, 244, 246, .92) 78%, rgba(243, 244, 246, 0) 100%);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      display: grid;
      gap: 8px;
      width: min(860px, 100%);
      margin: 0 auto;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1;
      letter-spacing: -.045em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      max-width: 52%;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
    }

    .status span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--line-2);
      flex: 0 0 auto;
    }

    .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(5, 150, 105, .12); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(217, 119, 6, .12); }
    .dot.err { background: var(--danger); box-shadow: 0 0 0 4px rgba(220, 38, 38, .12); }

    .stats {
      display: grid;
      grid-template-columns: 1.35fr .75fr;
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 6px 18px rgba(17, 24, 39, .05);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 28px;
      line-height: .98;
      font-weight: 950;
      letter-spacing: -.06em;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.small {
      font-size: 24px;
    }

    .setup {
      margin: 8px 0 10px;
      padding: 10px 12px;
      border: 1px solid rgba(217, 119, 6, .25);
      border-radius: 16px;
      background: #fffbeb;
      color: #78350f;
      font-size: 13px;
      line-height: 1.35;
    }

    .setup[hidden] { display: none; }

    .setup b {
      display: block;
      margin-bottom: 3px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 94px 34px;
      grid-template-areas:
        "product price delete"
        "qty     price delete";
      gap: 6px 8px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .row-num {
      position: absolute;
      left: 8px;
      top: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .field {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .field.product { grid-area: product; padding-left: 28px; }
    .field.qty { grid-area: qty; padding-left: 28px; }
    .field.price { grid-area: price; }
    .delete-wrap { grid-area: delete; align-self: stretch; }

    .label {
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .cell {
      width: 100%;
      height: 36px;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: 720;
    }

    .cell.product-input {
      height: 38px;
      font-size: 16px;
      font-weight: 860;
      letter-spacing: -.015em;
    }

    .cell.qty-input {
      height: 34px;
      background: var(--card-2);
      font-size: 14px;
    }

    .cell.price-input {
      height: 58px;
      text-align: right;
      font-size: 18px;
      font-weight: 920;
      font-variant-numeric: tabular-nums;
    }

    .delete-btn {
      width: 34px;
      height: 100%;
      min-height: 58px;
      border-radius: 13px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 24px;
      line-height: 1;
      font-weight: 650;
    }

    .delete-btn:active,
    .btn:active {
      transform: translateY(1px) scale(.99);
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 140px;
      border: 1px dashed var(--line-2);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .65);
      color: var(--muted);
      text-align: center;
      font-weight: 720;
    }

    .empty[hidden] { display: none; }

    .desktop-actions {
      display: none;
      gap: 8px;
      margin: 12px 0 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 850;
      box-shadow: 0 10px 20px rgba(17, 24, 39, .12);
    }

    .btn.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line-2);
      box-shadow: none;
    }

    .btn.danger {
      background: #fff;
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, .22);
      box-shadow: none;
    }

    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 8px 12px var(--safe-bottom);
      background: linear-gradient(180deg, transparent 0%, rgba(243, 244, 246, .9) 30%, rgba(243, 244, 246, .98) 100%);
      backdrop-filter: blur(14px);
    }

    .dock-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: rgba(255, 255, 255, .95);
      box-shadow: 0 12px 30px rgba(17, 24, 39, .12);
    }

    .dock-total {
      min-width: 0;
      padding: 4px 6px;
    }

    .dock-total span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .045em;
    }

    .dock-total strong {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 23px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }

    .dock .btn {
      min-height: 48px;
      border-radius: 15px;
      padding-inline: 18px;
    }

    @media (max-width: 370px) {
      .app { padding-inline: 8px; }
      .topbar { margin-inline: -8px; padding-inline: 8px; }
      h1 { font-size: 23px; }
      .status { max-width: 48%; }
      .stats { grid-template-columns: 1fr; }
      .row {
        grid-template-columns: minmax(0, 1fr) 82px 32px;
        gap: 6px;
        padding: 8px;
      }
      .cell.product-input { font-size: 15px; }
      .cell.price-input { font-size: 16px; }
      .dock-inner { grid-template-columns: 1fr; }
      .dock .btn { width: 100%; }
    }

    @media (min-width: 740px) {
      .app {
        padding: 24px 18px 32px;
      }

      .topbar {
        position: static;
        margin: 0 0 14px;
        padding: 0;
        background: transparent;
        backdrop-filter: none;
      }

      .topbar-inner {
        gap: 12px;
      }

      h1 {
        font-size: 36px;
      }

      .status {
        max-width: none;
      }

      .stats {
        grid-template-columns: 1fr .42fr;
      }

      .list {
        gap: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        box-shadow: var(--shadow);
      }

      .row {
        grid-template-columns: 56px minmax(0, 1.5fr) minmax(140px, .7fr) 130px 48px;
        grid-template-areas: "num product qty price delete";
        gap: 10px;
        padding: 9px 12px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        border-bottom: 1px solid var(--line);
      }

      .row:last-child { border-bottom: 0; }

      .row-num {
        position: static;
        grid-area: num;
        width: 34px;
        height: 34px;
        justify-self: center;
      }

      .field.product,
      .field.qty {
        padding-left: 0;
      }

      .field.price {
        align-self: end;
      }

      .label {
        font-size: 10px;
      }

      .cell,
      .cell.product-input,
      .cell.qty-input,
      .cell.price-input {
        height: 40px;
        font-size: 15px;
      }

      .cell.price-input {
        text-align: right;
      }

      .delete-btn {
        min-height: 40px;
        height: 40px;
      }

      .dock { display: none; }

      .desktop-actions {
        display: flex;
      }
    }

    /* ===== v5: compact mobile layout ===== */
    @media (max-width: 739px) {
      :root {
        --radius: 16px;
        --shadow: 0 5px 14px rgba(17, 24, 39, .06);
      }

      .app {
        width: 100%;
        padding: 8px 8px calc(74px + var(--safe-bottom));
      }

      .topbar {
        margin: -8px -8px 6px;
        padding: calc(var(--safe-top) + 4px) 8px 8px;
      }

      .topbar-inner {
        gap: 7px;
      }

      .title-row {
        gap: 8px;
      }

      h1 {
        font-size: 26px;
        letter-spacing: -.055em;
      }

      .status {
        max-width: 44%;
        min-height: 28px;
        padding: 5px 8px;
        font-size: 12px;
      }

      .stats {
        grid-template-columns: 1.2fr .68fr;
        gap: 7px;
      }

      .stat {
        padding: 9px 10px;
        border-radius: 16px;
      }

      .stat-label {
        margin-bottom: 2px;
        font-size: 10px;
      }

      .stat-value {
        font-size: 26px;
        line-height: .95;
      }

      .stat-value.small {
        font-size: 22px;
      }

      .setup {
        margin: 6px 0 8px;
        padding: 9px 10px;
        border-radius: 14px;
        font-size: 12px;
      }

      .list {
        gap: 6px;
      }

      .row {
        grid-template-columns: 24px minmax(0, 1fr) 78px 30px;
        grid-template-rows: 35px 29px;
        grid-template-areas:
          "num product price delete"
          "num qty     price delete";
        gap: 5px 6px;
        align-items: center;
        padding: 8px;
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .row-num {
        position: static;
        grid-area: num;
        align-self: start;
        justify-self: center;
        width: 23px;
        height: 23px;
        margin-top: 6px;
        font-size: 11px;
      }

      .field {
        gap: 0;
      }

      .field.product,
      .field.qty {
        padding-left: 0;
      }

      .label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .cell {
        border-radius: 11px;
        padding: 7px 9px;
      }

      .cell.product-input {
        height: 35px;
        font-size: 15px;
        font-weight: 820;
      }

      .cell.qty-input {
        height: 29px;
        background: var(--card-2);
        font-size: 13px;
        font-weight: 720;
      }

      .cell.price-input {
        height: 69px;
        padding: 6px;
        text-align: center;
        font-size: 17px;
        font-weight: 920;
      }

      .delete-btn {
        width: 30px;
        height: 69px;
        min-height: 69px;
        border-radius: 12px;
        background: #fff1f2;
        font-size: 21px;
      }

      .empty {
        min-height: 120px;
        border-radius: 16px;
      }

      .dock {
        padding: 6px 8px var(--safe-bottom);
      }

      .dock-inner {
        gap: 7px;
        padding: 7px;
        border-radius: 17px;
      }

      .dock-total {
        padding: 3px 5px;
      }

      .dock-total span {
        font-size: 10px;
      }

      .dock-total strong {
        margin-top: 2px;
        font-size: 21px;
      }

      .dock .btn {
        min-height: 45px;
        padding-inline: 15px;
        border-radius: 14px;
        font-size: 15px;
      }
    }

    @media (max-width: 370px) {
      .stats {
        grid-template-columns: 1fr 72px;
      }

      .row {
        grid-template-columns: 22px minmax(0, 1fr) 68px 28px;
        grid-template-rows: 34px 28px;
        gap: 4px 5px;
        padding: 7px;
      }

      .row-num {
        width: 21px;
        height: 21px;
        font-size: 10px;
      }

      .cell.product-input {
        height: 34px;
        font-size: 14px;
      }

      .cell.qty-input {
        height: 28px;
        font-size: 12px;
      }

      .cell.price-input,
      .delete-btn {
        height: 66px;
        min-height: 66px;
      }

      .cell.price-input {
        font-size: 15px;
      }

      .delete-btn {
        width: 28px;
      }

      .dock-inner {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .dock .btn {
        width: auto;
      }
    }

  </style>
</head>

  <main class="app">

        <div class="title-row">
          <h1>Закупки</h1>

        <section class="stats" aria-label="Итоги">

          <div class="stat">

            <strong class="stat-value small" id="countTop">0</strong>

      Сейчас изменения сохраняются только на этом устройстве. Вставь полный <code>firebaseConfig</code> в начало файла.

    <section class="list" id="rows" aria-label="Список закупок"></section>
    <div class="empty" id="emptyState" hidden>Пока строк нет.<br />Нажми «Добавить».</div>

    <div class="desktop-actions">
      <button class="btn" id="addRow" type="button">+ Добавить строку</button>
      <button class="btn secondary" id="exportJson" type="button">Скачать JSON</button>
      <button class="btn danger" id="resetRows" type="button">Сбросить</button>
    </div>
  </main>

  <div class="dock">

        <strong id="totalDock">0</strong>

      { id: "-OumTivGLvHiOGE0-UfT", product: "Дошираки", qty: "7", price: "435" },
      { id: "-OumU3JzD69XZvpk-uvE", product: "Хлеб", qty: "2", price: "100" },
      { id: "-OumUFavvktb_S1G7wxi", product: "Лаваш", qty: "2", price: "100" },
      { id: "-OumUZ1CYxni2PScxMwH", product: "Бумаж полотенце", qty: "2", price: "300" }
    ];

    let rows = [];
    let saveTimer = null;
    let saveMode = "local";
    let firebaseSet = null;
    let firebaseRef = null;
    let remoteReady = false;
    let unsubscribeFirebase = null;

    const rowsEl = document.querySelector("#rows");
    const emptyStateEl = document.querySelector("#emptyState");
    const syncStatusEl = document.querySelector("#syncStatus");
    const setupHelpEl = document.querySelector("#setupHelp");
    const totalTopEl = document.querySelector("#totalTop");
    const totalDockEl = document.querySelector("#totalDock");
    const countTopEl = document.querySelector("#countTop");
    const addRowBtn = document.querySelector("#addRow");
    const addRowDockBtn = document.querySelector("#addRowDock");
    const exportJsonBtn = document.querySelector("#exportJson");
    const resetRowsBtn = document.querySelector("#resetRows");

    function isPlaceholder(value) {
      const text = String(value || "").trim();
      return !text || text.startsWith("PASTE_");
    }

    function hasFirebaseConfig() {
      return !["apiKey", "databaseURL", "projectId"].some((key) => isPlaceholder(firebaseConfig[key]));
    }

    function makeId() {
      return globalThis.crypto?.randomUUID?.() || `row-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeRow(row = {}) {
      return {
        id: String(row.id || makeId()),
        product: String(row.product ?? ""),
        qty: String(row.qty ?? ""),
        price: row.price === null || row.price === undefined ? "" : String(row.price)
      };
    }

    function normalizeRows(value) {
      if (Array.isArray(value)) return value.map(normalizeRow);
      if (value && typeof value === "object") return Object.values(value).map(normalizeRow);
      return [];
    }

    function parsePrice(value) {
      const cleaned = String(value ?? "").replace(/\s/g, "").replace(",", ".");
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : 0;
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(value);
    }

    function calculateTotal() {
      return rows.reduce((sum, row) => sum + parsePrice(row.price), 0);
    }

    function setStatus(text, kind = "warn") {
      const dotClass = kind === "ok" ? "ok" : kind === "err" ? "err" : "warn";
      syncStatusEl.innerHTML = `<span class="dot ${dotClass}"></span><span>${escapeHtml(text)}</span>`;
    }

    function updateSummary() {
      totalTopEl.textContent = formatMoney(calculateTotal());
      totalDockEl.textContent = formatMoney(calculateTotal());
      countTopEl.textContent = rows.length;
    }

    function render() {
      const active = document.activeElement;
      const activeRowId = active?.closest?.(".row[data-id]")?.dataset?.id;
      const activeField = active?.dataset?.field;
      const selectionStart = active?.selectionStart;
      const selectionEnd = active?.selectionEnd;

      rowsEl.innerHTML = "";
      emptyStateEl.hidden = rows.length > 0;

      const fragment = document.createDocumentFragment();

      rows.forEach((row, index) => {
        const card = document.createElement("article");
        card.className = "row";
        card.dataset.id = row.id;
        card.innerHTML = `
          <div class="row-num">${index + 1}</div>

          <label class="field product">
            <span class="label">Продукт</span>
            <input class="cell product-input" data-field="product" value="${escapeHtml(row.product)}" placeholder="Название" autocomplete="off" aria-label="Продукт, строка ${index + 1}" />
          </label>

          <label class="field qty">
            <span class="label">Кол-во</span>
            <input class="cell qty-input" data-field="qty" value="${escapeHtml(row.qty)}" placeholder="Кол-во" autocomplete="off" aria-label="Количество, строка ${index + 1}" />
          </label>

          <label class="field price">
            <span class="label">Цена</span>
            <input class="cell price-input" data-field="price" value="${escapeHtml(row.price)}" placeholder="0" inputmode="decimal" autocomplete="off" aria-label="Цена, строка ${index + 1}" />
          </label>

          <div class="delete-wrap">
            <button class="delete-btn" type="button" aria-label="Удалить строку">×</button>
          </div>
        `;

        fragment.appendChild(card);
      });

      rowsEl.appendChild(fragment);
      updateSummary();

      if (activeRowId && activeField) {
        const nextActive = rowsEl.querySelector(`.row[data-id="${CSS.escape(activeRowId)}"] input[data-field="${CSS.escape(activeField)}"]`);
        if (nextActive) {
          nextActive.focus({ preventScroll: true });
          if (typeof selectionStart === "number" && typeof selectionEnd === "number") {
            nextActive.setSelectionRange(selectionStart, selectionEnd);
          }
        }
      }
    }

    function readLocalRows() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        return raw ? normalizeRows(JSON.parse(raw)) : normalizeRows(initialRows);
      } catch {
        return normalizeRows(initialRows);
      }
    }

    function writeLocalRows(statusText = "Локально") {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(rows));
      setStatus(statusText, "warn");
    }

    function persistRows() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          if (saveMode === "firebase" && firebaseSet && firebaseRef && remoteReady) {
            await firebaseSet(firebaseRef, rows);
            setStatus("Онлайн", "ok");
          } else {
            writeLocalRows();
          }
        } catch (error) {
          console.error(error);
          saveMode = "local";
          setupHelpEl.hidden = false;
          writeLocalRows("Firebase недоступен");
        }
      }, 180);
    }

    function addRow() {
      rows.push(normalizeRow({ product: "", qty: "", price: "" }));
      render();
      persistRows();

      requestAnimationFrame(() => {
        const lastInput = rowsEl.querySelector(".row:last-child input[data-field='product']");
        lastInput?.focus();
        lastInput?.scrollIntoView({ block: "center", behavior: "smooth" });
      });
    }

    rowsEl.addEventListener("input", (event) => {
      const input = event.target.closest("input[data-field]");
      if (!input) return;

      const rowEl = input.closest(".row[data-id]");
      const row = rows.find((item) => item.id === rowEl.dataset.id);
      if (!row) return;

      const field = input.dataset.field;
      row[field] = field === "price" ? input.value.replace(/[^0-9.,\s-]/g, "") : input.value;

      if (field === "price" && row[field] !== input.value) {
        input.value = row[field];
      }

      updateSummary();
      persistRows();
    });

    rowsEl.addEventListener("click", (event) => {
      const button = event.target.closest(".delete-btn");
      if (!button) return;

      const rowEl = button.closest(".row[data-id]");
      const row = rows.find((item) => item.id === rowEl.dataset.id);
      const label = row?.product?.trim() || "строку";

      if (!confirm(`Удалить «${label}»?`)) return;

      rows = rows.filter((item) => item.id !== rowEl.dataset.id);
      render();
      persistRows();
    });

    addRowBtn?.addEventListener("click", addRow);
    addRowDockBtn.addEventListener("click", addRow);

    exportJsonBtn?.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(rows, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "lake-trip-items.json";
      link.click();
      URL.revokeObjectURL(url);
    });

    resetRowsBtn?.addEventListener("click", () => {
      if (!confirm("Сбросить список к начальному варианту?")) return;
      rows = normalizeRows(initialRows);
      render();
      persistRows();
    });

    async function initFirebaseMode() {
      const [appModule, databaseModule] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js")
      ]);

      const app = appModule.initializeApp(firebaseConfig);
      const db = databaseModule.getDatabase(app);
      firebaseRef = databaseModule.ref(db, DB_PATH);
      firebaseSet = databaseModule.set;
      saveMode = "firebase";

      const snapshot = await databaseModule.get(firebaseRef);

      if (!snapshot.exists()) {
        rows = normalizeRows(initialRows);
        await firebaseSet(firebaseRef, rows);
      } else {
        rows = normalizeRows(snapshot.val());
        render();
      }

      unsubscribeFirebase = databaseModule.onValue(firebaseRef, (snapshot) => {
        remoteReady = true;
        const nextRows = normalizeRows(snapshot.val() || []);

        if (JSON.stringify(nextRows) !== JSON.stringify(rows)) {
          rows = nextRows;
          render();
        }

        setupHelpEl.hidden = true;
        setStatus("Онлайн", "ok");
      }, (error) => {
        console.error(error);
        if (unsubscribeFirebase) unsubscribeFirebase();
        saveMode = "local";
        rows = readLocalRows();
        render();
        setupHelpEl.hidden = false;
        setStatus("Нет доступа", "err");
      });
    }

    async function init() {
      rows = normalizeRows(initialRows);
      render();

      if (!hasFirebaseConfig()) {
        saveMode = "local";
        rows = readLocalRows();
        render();
        setupHelpEl.hidden = false;
        setStatus("Локально", "warn");
        return;
      }

      try {
        setStatus("Подключение…", "warn");
        await initFirebaseMode();
      } catch (error) {
        console.error(error);
        saveMode = "local";
        rows = readLocalRows();
        render();
        setupHelpEl.hidden = false;
        setStatus("Локально", "warn");
      }
    }

    init();
  </script>
</body>
</html>
